name: secret-scan

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan HEAD with gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4
          detect --source=/repo --no-git --config=/repo/.gitleaks.toml --redact -v
