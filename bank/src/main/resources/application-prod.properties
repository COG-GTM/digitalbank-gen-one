# ===============================
# = Production profile
# ===============================
# Activate with SPRING_PROFILES_ACTIVE=prod.
# Hibernate performs no schema management in production; the schema is owned
# exclusively by the versioned Flyway migrations in db/migration/<vendor>.
spring.jpa.hibernate.ddl-auto = none

# Migrations are a controlled deployment step, not a side effect of every
# start: run a one-off migration job with SPRING_FLYWAY_ENABLED=true before
# rolling out the application.
spring.flyway.enabled=false

# Never auto-baseline a production database: a non-empty schema without Flyway
# history makes the migration job fail instead of marking V1 as applied. After
# verifying the existing schema matches V1 (e.g. one run with
# SPRING_JPA_HIBERNATE_DDL_AUTO=validate), baseline it deliberately with
# SPRING_FLYWAY_BASELINE_ON_MIGRATE=true on that single migration run.
spring.flyway.baseline-on-migrate=false
