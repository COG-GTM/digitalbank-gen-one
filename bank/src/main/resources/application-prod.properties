# ===============================
# = Production profile
# ===============================
# Activate with SPRING_PROFILES_ACTIVE=prod.
# Hibernate performs no schema management in production; the schema is owned
# exclusively by the versioned Flyway migrations in db/migration/<vendor>.
spring.jpa.hibernate.ddl-auto = none

# Migrations are a controlled deployment step, not a side effect of every
# start: run a one-off migration job with SPRING_FLYWAY_ENABLED=true before
# rolling out the application.
spring.flyway.enabled=false
