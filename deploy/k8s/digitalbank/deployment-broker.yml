apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-bank-broker-deployment
  namespace: digibank
  labels:
    app: digital-bank-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: digital-bank-broker
  template:
    metadata:
      labels:
        app: digital-bank-broker
    spec:
      containers:
      - name: digital-bank-broker
        # Apache Artemis 2.31.2 on eclipse-temurin:21-jre (broker/Dockerfile)
        image: digisic/digitalbroker:2.31.2
        env:
          - name: ARTEMIS_USER
            value: "admin"
          - name: ARTEMIS_PASSWORD
            value: "admin"
        ports:
          - name: broker-port-1
            containerPort: 8161
          - name: broker-port-2
            containerPort: 61616
        readinessProbe:
          tcpSocket:
            port: broker-port-2
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: broker-port-2
          initialDelaySeconds: 60
          periodSeconds: 20

---

apiVersion: v1
kind: Service
metadata:
  name: digital-bank-broker-svc
  namespace: digibank
spec:
  selector:
    app: digital-bank-broker
  ports:
    - name: http1
      port: 8161
      targetPort: broker-port-1
    - name: http2
      port: 61616
      targetPort: broker-port-2
