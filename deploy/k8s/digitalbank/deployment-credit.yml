apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-bank-credit-deployment
  namespace: digibank
  labels:
    app: digital-bank-credit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: digital-bank-credit
  template:
    metadata:
      labels:
        app: digital-bank-credit
    spec:
      containers:
      - name: digital-bank-credit
        # Java 21 executable jar on eclipse-temurin:21-jre (credit/Dockerfile)
        image: digisic/digitalcredit:java21
        ports:
          - name: db-credit-port
            containerPort: 3500
        env:
          # Debug Options
          - name: LOGGING_LEVEL_IO_DIGISIC_CREDIT
            value: "INFO"
          # Digital Broker Connection
          - name: SPRING_ARTEMIS_MODE
            value: "native"
          - name: SPRING_ARTEMIS_BROKER_URL
            value: "tcp://digital-bank-broker-svc:61616"
          - name: SPRING_ARTEMIS_USER
            value: "admin"
          - name: SPRING_ARTEMIS_PASSWORD
            value: "admin"
          # Credit Application Process
          - name: IO_DIGISIC_CREDIT_APP_PROCESS_ENABLED
            value: "true"
          - name: IO_DIGISIC_CREDIT_APP_PROCESS_TIME
            value: "20"
          # Digital Credit Application Process JMS Queues
          - name: IO_DIGISIC_PARTNER_CREDIT_APP_REQUEST
            value: "CREDIT.APP.REQUEST"
          - name: IO_DIGISIC_PARTNER_CREDIT_APP_RESPONSE
            value: "CREDIT.APP.RESPONSE"
        readinessProbe:
          httpGet:
            scheme: HTTPS
            path: /credit/api/v1/health
            port: db-credit-port
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            scheme: HTTPS
            path: /credit/api/v1/health
            port: db-credit-port
          initialDelaySeconds: 120
          periodSeconds: 20

---

apiVersion: v1
kind: Service
metadata:
  name: digital-bank-credit-svc
  namespace: digibank
spec:
  selector:
    app: digital-bank-credit
  ports:
    - name: https-credit
      port: 3500
      targetPort: db-credit-port
