# =====================================================================
# PostgreSQL variant - overlay on the top-level docker-compose.yml
#   docker compose -f docker-compose.yml -f deploy/docker-compose/docker-compose-postgres.yml up -d --build
#   (or ./digitalbank.sh up postgres)
# Paths are relative to the repository root (the first compose file).
# =====================================================================
services:

# =====================================================================
# Database Service: PostgreSQL
# =====================================================================
  postgres:
    image: postgres:16
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_PASSWORD: Demo123!
    ports:
      - "5432:5432"
    networks:
      - digitalnet
    volumes:
      - ./deploy/docker-compose/scripts/postgres:/docker-entrypoint-initdb.d:ro
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digitalcredit"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  credit:
    environment:
      SPRING_DATASOURCE_USERNAME: digitaluser
      SPRING_DATASOURCE_PASSWORD: Demo123!
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/digitalcredit
    depends_on:
      postgres:
        condition: service_healthy

  bank:
    environment:
      SPRING_DATASOURCE_USERNAME: digitaluser
      SPRING_DATASOURCE_PASSWORD: Demo123!
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/digitalbank
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgresdata:
