version: "3.5"
services:

# =====================================================================
# Database Service: MySQL Server
# =====================================================================
  mysql:
    image: mysql:latest
    container_name: mysql
    hostname: mysql
    privileged: true
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
      MYSQL_USER: digitaluser
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD}
      MYSQL_DATABASE: digitalbank
    ports:
      - "3306:3306"
    networks:
      - digitalnet
    volumes:
      - ./scripts/mysql:/docker-entrypoint-initdb.d
      - mysqldata:/var/lib/mysql
    cap_add:
      - SYS_NICE
    restart: unless-stopped

# =====================================================================
# Digital Broker Service Configuration
# =====================================================================
  broker:
    image: digisic/digitalbroker:latest
    container_name: broker
    hostname: broker
    environment:
      ARTEMIS_USER: ${ARTEMIS_USER:?set ARTEMIS_USER}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:?set ARTEMIS_PASSWORD}
      CREATE_ARGUMENTS: --user ${ARTEMIS_USER:?set ARTEMIS_USER} --password ${ARTEMIS_PASSWORD:?set ARTEMIS_PASSWORD} --silent --http-host 0.0.0.0 --relax-jolokia
    ports:
      - "8161:8161"
      - "61616:61616"
    networks:
      - digitalnet
    restart: unless-stopped

# =====================================================================
# Digital Credit Service Configuration
# =====================================================================    
  credit:
    image: digisic/digitalcredit:latest
    container_name: credit
    hostname: credit
    environment:

      # Logging Options
      LOGGING_LEVEL_IO_DIGISIC_CREDIT: INFO

      # Secrets (injected from the environment / .env, never committed)
      IO_DIGISIC_CREDIT_API_JWT_SECRET: ${CREDIT_JWT_SECRET:?set CREDIT_JWT_SECRET}
      IO_DIGISIC_CREDIT_ADMIN_PASSWORD: ${CREDIT_ADMIN_PASSWORD:?set CREDIT_ADMIN_PASSWORD}
      DIGISIC_KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD:?set KEYSTORE_PASSWORD}

      # Digital Broker Connection
      SPRING_ARTEMIS_MODE: native
      SPRING_ARTEMIS_HOST: broker
      SPRING_ARTEMIS_PORT: 61616
      SPRING_ARTEMIS_USER: ${ARTEMIS_USER:?set ARTEMIS_USER}
      SPRING_ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:?set ARTEMIS_PASSWORD}

      # Credit Application Process
      IO_DIGISIC_CREDIT_APP_PROCESS_ENABLED: 'true'
      IO_DIGISIC_CREDIT_APP_PROCESS_TIME: 20

      # Digital Credit Application Process JMS Queues
      IO_DIGISIC_PARTNER_CREDIT_APP_REQUEST: CREDIT.APP.REQUEST
      IO_DIGISIC_PARTNER_CREDIT_APP_RESPONSE: CREDIT.APP.RESPONSE

      # Database Configuration
      SPRING_DATASOURCE_PLATFORM: mysql
      SPRING_DATASOURCE_USERNAME: digitaluser
      SPRING_DATASOURCE_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/digitalcredit?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL55Dialect

    ports:
      - "3500:8080" # HTTP
      - "3535:8443" # HTTPS
    networks:
      - digitalnet
    volumes:
      - digitalcredit:/usr/local/tomcat/conf
      - ${KEYSTORE_FILE:?set KEYSTORE_FILE}:/usr/local/tomcat/conf/digisic.p12:ro
    depends_on:
      - mysql
      - broker
    restart: unless-stopped

# =====================================================================
# Digital Bank Service Configuration
# =====================================================================
  bank:
    image: digisic/digitalbank:latest
    container_name: bank
    hostname: bank
    environment:
    
      # Session Management
      SERVER_SERVLET_SESSION_TIMEOUT: 5m
      IO_DIGISIC_MAX_SESSIONS: 10000 # Set to 1 for single concurrent user session

      # Logging Options
      LOGGING_LEVEL_IO_DIGISIC_BANK: INFO

      # Secrets (injected from the environment / .env, never committed)
      IO_DIGISIC_BANK_API_JWT_SECRET: ${BANK_JWT_SECRET:?set BANK_JWT_SECRET}
      IO_DIGISIC_BANK_ADMIN_PASSWORD: ${BANK_ADMIN_PASSWORD:?set BANK_ADMIN_PASSWORD}
      IO_DIGISIC_BANK_SAMPLE_PASSWORD: ${BANK_SAMPLE_PASSWORD:-}
      DIGISIC_KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD:?set KEYSTORE_PASSWORD}
      
      # Digital Broker connection
      SPRING_ARTEMIS_MODE: native
      SPRING_ARTEMIS_HOST: broker
      SPRING_ARTEMIS_PORT: 61616
      SPRING_ARTEMIS_USER: ${ARTEMIS_USER:?set ARTEMIS_USER}
      SPRING_ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:?set ARTEMIS_PASSWORD}

      # Digital Credit Connection
      IO_DIGISIC_CREDIT_ENABLED: 'true'
      IO_DIGISIC_CREDIT_PROTOCOL: http
      IO_DIGISIC_CREDIT_HOST: credit
      IO_DIGISIC_CREDIT_PORT: 8080
      IO_DIGISIC_CREDIT_CONTEXT-PATH: /credit
      IO_DIGISIC_CREDIT_USERNAME: admin@demo.io
      IO_DIGISIC_CREDIT_PASSWORD: ${CREDIT_ADMIN_PASSWORD:?set CREDIT_ADMIN_PASSWORD}

      # Digital Credit Application Process JMS Queues
      IO_DIGISIC_PARTNER_CREDIT_APP_REQUEST: CREDIT.APP.REQUEST
      IO_DIGISIC_PARTNER_CREDIT_APP_RESPONSE: CREDIT.APP.RESPONSE

      # ATM Location Service Connection 
      IO_DIGISIC_BANK_ATM_PROTOCOL: https
      IO_DIGISIC_BANK_ATM_HOST: bankingservices.io # uat-api.synapsefi.com #
      IO_DIGISIC_BANK_ATM_PORT: 

      # VISA Direct Payment Service
      IO_DIGISIC_BANK_VISA_PROTOCOL: https
      IO_DIGISIC_BANK_VISA_HOST: creditservices.io
      IO_DIGISIC_BANK_VISA_PORT:
      
      # Open Banking API Service
      IO_DIGISIC_BANK_OBP_ENABLED: 'true'
      IO_DIGISIC_BANK_OBP_CONSUMER_KEY: ${OBP_CONSUMER_KEY:-}
      IO_DIGISIC_BANK_OBP_VERSION: v4.0.0
      IO_DIGISIC_BANK_OBP_PROTOCOL: https
      IO_DIGISIC_BANK_OBP_HOST:
      IO_DIGISIC_BANK_OBP_PORT:

      # Database Configuration
      SPRING_DATASOURCE_PLATFORM: mysql
      SPRING_DATASOURCE_USERNAME: digitaluser
      SPRING_DATASOURCE_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/digitalbank?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL5Dialect

    ports:
      - "8080:8080" # HTTP
      - "8443:8443" # HTTPS
    networks:
      - digitalnet
    volumes:
      - digitalbank:/usr/local/tomcat/conf
      - ${KEYSTORE_FILE:?set KEYSTORE_FILE}:/usr/local/tomcat/conf/digisic.p12:ro
    depends_on:
      - mysql
      - broker
      - credit
    restart: unless-stopped
      
# =====================================================================
# Docker Network Configuration
# =====================================================================
networks:
  digitalnet:
volumes:
  digitalcredit:
  digitalbank:
  mysqldata:

