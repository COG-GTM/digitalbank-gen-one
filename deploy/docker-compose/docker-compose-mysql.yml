# =====================================================================
# MySQL variant - overlay on the top-level docker-compose.yml
#   docker compose -f docker-compose.yml -f deploy/docker-compose/docker-compose-mysql.yml up -d --build
#   (or ./digitalbank.sh up mysql)
# Paths are relative to the repository root (the first compose file).
# =====================================================================
services:

# =====================================================================
# Database Service: MySQL Server
# =====================================================================
  mysql:
    image: mysql:8.4
    container_name: mysql
    hostname: mysql
    environment:
      MYSQL_ROOT_PASSWORD: Demo123!
      MYSQL_USER: digitaluser
      MYSQL_PASSWORD: Demo123!
      MYSQL_DATABASE: digitalbank
    ports:
      - "3306:3306"
    networks:
      - digitalnet
    volumes:
      - ./deploy/docker-compose/scripts/mysql:/docker-entrypoint-initdb.d:ro
      - mysqldata:/var/lib/mysql
    cap_add:
      - SYS_NICE
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pDemo123!"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  credit:
    environment:
      SPRING_DATASOURCE_USERNAME: digitaluser
      SPRING_DATASOURCE_PASSWORD: Demo123!
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/digitalcredit?useSSL=false&allowPublicKeyRetrieval=true
    depends_on:
      mysql:
        condition: service_healthy

  bank:
    environment:
      SPRING_DATASOURCE_USERNAME: digitaluser
      SPRING_DATASOURCE_PASSWORD: Demo123!
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/digitalbank?useSSL=false&allowPublicKeyRetrieval=true
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysqldata:
