# =====================================================================
# Microsoft SQL Server variant - overlay on the top-level docker-compose.yml
#   docker compose -f docker-compose.yml -f deploy/docker-compose/docker-compose-mssql.yml up -d --build
#   (or ./digitalbank.sh up mssql)
# Paths are relative to the repository root (the first compose file).
# The image is pinned to a 2019 CU that still ships /opt/mssql-tools, which
# scripts/mssql/init.sh uses; databases are created ~90s after start.
# =====================================================================
services:

# =====================================================================
# Database Service: Microsoft SQL Server
# =====================================================================
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-CU27-ubuntu-20.04
    container_name: mssql
    hostname: mssql
    command: sh -c '/usr/src/init.sh & /opt/mssql/bin/sqlservr'
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: Demo123!
    ports:
      - "1433:1433"
    networks:
      - digitalnet
    volumes:
      - ./deploy/docker-compose/scripts/mssql:/usr/src:ro
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U digitaluser -P 'Demo123!' -d digitalcredit -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 100s
    restart: unless-stopped

  credit:
    environment:
      SPRING_DATASOURCE_USERNAME: digitaluser
      SPRING_DATASOURCE_PASSWORD: Demo123!
      SPRING_DATASOURCE_URL: jdbc:sqlserver://mssql:1433;databaseName=digitalcredit;encrypt=false
    depends_on:
      mssql:
        condition: service_healthy

  bank:
    environment:
      SPRING_DATASOURCE_USERNAME: digitaluser
      SPRING_DATASOURCE_PASSWORD: Demo123!
      SPRING_DATASOURCE_URL: jdbc:sqlserver://mssql:1433;databaseName=digitalbank;encrypt=false
    depends_on:
      mssql:
        condition: service_healthy

volumes:
  mssqldata:
